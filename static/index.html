<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCPP CPMS Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      color: #111827;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .5px; }
    header .subtitle { font-size: .72rem; color: #94a3b8; margin-top: 2px; }

    #conn-pill {
      font-size: .75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: #334155;
      color: #94a3b8;
      transition: background .3s, color .3s;
    }
    #conn-pill.connected  { background: #166534; color: #bbf7d0; }
    #conn-pill.error      { background: #991b1b; color: #fecaca; }

    /* ── Main layout ─────────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left: Stations ──────────────────────────────────────── */
    #stations-panel {
      width: 320px;
      min-width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #d1d5db;
    }

    .panel-hdr {
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      font-size: .8rem;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: .6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-hdr span.count {
      background: #e0e7ff;
      color: #3730a3;
      font-size: .7rem;
      padding: 1px 7px;
      border-radius: 10px;
    }

    #stations-scroll {
      overflow-y: auto;
      flex: 1;
      padding: 12px;
    }

    .empty-hint {
      color: #9ca3af;
      text-align: center;
      padding: 40px 20px;
      font-size: .85rem;
    }

    /* ── Station card ────────────────────────────────────────── */
    .s-card {
      background: #fff;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
      border-left: 4px solid #9ca3af;
      transition: border-color .3s;
    }
    .s-card.online  { border-left-color: #16a34a; }
    .s-card.faulted { border-left-color: #dc2626; }

    .s-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .s-cp-id {
      font-family: monospace;
      font-weight: 700;
      font-size: .95rem;
    }
    .s-status-pill {
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
    }
    .pill-online  { background: #dcfce7; color: #15803d; }
    .pill-offline { background: #f3f4f6; color: #6b7280; }

    .s-meta {
      font-size: .78rem;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .connectors { display: flex; flex-wrap: wrap; gap: 5px; }
    .c-badge {
      font-size: .73rem;
      padding: 3px 9px;
      border-radius: 4px;
      color: #fff;
      font-weight: 500;
    }
    .cs-Available     { background: #16a34a; }
    .cs-Charging      { background: #2563eb; }
    .cs-Preparing     { background: #d97706; }
    .cs-Finishing     { background: #d97706; }
    .cs-Faulted       { background: #dc2626; }
    .cs-Unavailable   { background: #6b7280; }
    .cs-SuspendedEVSE { background: #ea580c; }
    .cs-SuspendedEV   { background: #ea580c; }
    .cs-Reserved      { background: #7c3aed; }
    .cs-Unknown       { background: #9ca3af; }

    .s-hb { font-size: .72rem; color: #9ca3af; margin-top: 8px; }
    .s-hb.stale { color: #dc2626; }

    .s-actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn-start {
      flex: 1;
      padding: 5px 0;
      font-size: .75rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
    }
    .btn-start:hover { background: #15803d; }
    .btn-stop {
      flex: 1;
      padding: 5px 0;
      font-size: .75rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #dc2626;
      color: #fff;
    }
    .btn-stop:hover { background: #b91c1c; }
    .btn-start:disabled, .btn-stop:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* ── Right: Logs ─────────────────────────────────────────── */
    #logs-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #log-scroll {
      flex: 1;
      overflow-y: auto;
    }

    .clear-btn {
      font-size: .72rem;
      padding: 3px 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      cursor: pointer;
      background: #fff;
      color: #6b7280;
    }
    .clear-btn:hover { background: #f9fafb; }

    #log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
    }
    #log-table thead th {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 8px 10px;
      text-align: left;
      font-size: .72rem;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 2px solid #e5e7eb;
      z-index: 1;
    }
    #log-table tbody td {
      padding: 5px 10px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
    }
    #log-table tbody tr:hover td { background: #f9fafb; }

    .ts-cell   { font-family: monospace; color: #9ca3af; white-space: nowrap; font-size: .75rem; }
    .cp-cell   { font-family: monospace; font-weight: 700; white-space: nowrap; }
    .dir-cell  { font-weight: 700; font-size: .8rem; }
    .dir-IN    { color: #1d4ed8; }
    .dir-OUT   { color: #15803d; }
    .dir-SYS   { color: #9ca3af; }
    .act-cell  { font-weight: 500; }

    .pay-cell {
      color: #6b7280;
      font-family: monospace;
      font-size: .73rem;
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .pay-cell.expanded {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>OCPP CPMS Dashboard</h1>
      <div class="subtitle">OCPP 1.6J &bull; Lite</div>
    </div>
    <div id="conn-pill">● Bağlanıyor...</div>
  </header>

  <div class="main">

    <!-- Left: Station list -->
    <div id="stations-panel">
      <div class="panel-hdr">
        İstasyonlar
        <span class="count" id="station-count">0</span>
      </div>
      <div id="stations-scroll">
        <p class="empty-hint" id="empty-hint">Henüz bağlı istasyon yok.</p>
      </div>
    </div>

    <!-- Right: Message log -->
    <div id="logs-panel">
      <div class="panel-hdr">
        Mesaj Logları
        <button class="clear-btn" onclick="clearLogs()">Temizle</button>
      </div>
      <div id="log-scroll">
        <table id="log-table">
          <thead>
            <tr>
              <th>Zaman</th>
              <th>CP ID</th>
              <th>Yön</th>
              <th>Mesaj</th>
              <th>Payload</th>
            </tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ── Helpers ──────────────────────────────────────────────────
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtTs(iso) {
      if (!iso) return '';
      // "2026-06-29T10:23:45.123Z" -> "10:23:45.123"
      var t = iso.replace('Z', '').split('T');
      return t.length > 1 ? t[1].substring(0, 12) : iso;
    }

    // ── Log table ─────────────────────────────────────────────────
    var MAX_ROWS = 300;

    function addLogRow(ev) {
      var tbody = document.getElementById('log-body');
      var tr = document.createElement('tr');

      var payStr = JSON.stringify(ev.payload || {});

      tr.innerHTML =
        '<td class="ts-cell">'  + esc(fmtTs(ev.ts))        + '</td>' +
        '<td class="cp-cell">'  + esc(ev.cp_id || '')       + '</td>' +
        '<td class="dir-cell dir-' + esc(ev.direction || '') + '">' + esc(ev.direction || '') + '</td>' +
        '<td class="act-cell">' + esc(ev.action || '')       + '</td>' +
        '<td class="pay-cell" title="' + esc(payStr) + '">' + esc(payStr) + '</td>';

      // Click payload cell to expand/collapse
      tr.querySelector('.pay-cell').addEventListener('click', function() {
        this.classList.toggle('expanded');
      });

      tbody.prepend(tr);

      while (tbody.children.length > MAX_ROWS) {
        tbody.removeChild(tbody.lastChild);
      }
    }

    function clearLogs() {
      document.getElementById('log-body').innerHTML = '';
    }

    // ── Station cards ─────────────────────────────────────────────
    var onlineCount = 0;

    function updateStationCount() {
      document.getElementById('station-count').textContent = String(onlineCount);
    }

    function connectorBadgesHtml(connectors) {
      var entries = Object.entries(connectors || {});
      if (!entries.length) return '<span style="color:#9ca3af;font-size:.75rem">Bekleniyor…</span>';
      return entries.map(function(pair) {
        var id = pair[0];
        var c  = pair[1];
        var label = id === '0' ? 'CP' : 'C' + id;
        var cls   = 'cs-' + (c.status || 'Unknown');
        return '<span class="c-badge ' + esc(cls) + '">' + esc(label) + ': ' + esc(c.status || '') + '</span>';
      }).join('');
    }

    function hasFault(connectors) {
      return Object.values(connectors || {}).some(function(c) { return c.status === 'Faulted'; });
    }

    function heartbeatHtml(isoTs) {
      if (!isoTs) return '';
      var stale = false;
      try {
        var diffMs = Date.now() - new Date(isoTs).getTime();
        stale = diffMs > 60000; // stale if no heartbeat for > 60s
      } catch(e) {}
      var cls = stale ? 's-hb stale' : 's-hb';
      var label = stale ? '⚠ Heartbeat kesildi: ' : 'Son Heartbeat: ';
      return '<div class="' + cls + '">' + label + fmtTs(isoTs) + '</div>';
    }

    function sendAction(cpId, action) {
      var btns = document.querySelectorAll('#card-' + cpId + ' button');
      btns.forEach(function(b) { b.disabled = true; });
      fetch('/api/action', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cp_id: cpId, action: action, connector_id: 1})
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) console.warn('Action error:', data.error);
      })
      .catch(function(e) { console.error(e); })
      .finally(function() {
        btns.forEach(function(b) { b.disabled = false; });
      });
    }

    function upsertCard(ev) {
      var cpId = ev.cp_id;
      var cardId = 'card-' + cpId;
      var scroll = document.getElementById('stations-scroll');

      var hint = document.getElementById('empty-hint');
      if (hint) hint.remove();

      var card = document.getElementById(cardId);
      var isNew = !card;
      if (isNew) {
        card = document.createElement('div');
        card.id = cardId;
        scroll.appendChild(card);
        onlineCount++;
        updateStationCount();
      }

      var fault = hasFault(ev.connectors);
      card.className = 's-card ' + (fault ? 'faulted' : 'online');

      var meta = [ev.vendor, ev.model].filter(Boolean).join(' ');
      var fw   = ev.firmware ? ' &bull; FW: ' + esc(ev.firmware) : '';

      // Determine button states from connector 1 status
      var c1status = (ev.connectors && ev.connectors['1']) ? ev.connectors['1'].status : 'Unknown';
      var ACTIVE_STATUSES = ['Charging', 'Preparing', 'Finishing', 'SuspendedEV', 'SuspendedEVSE'];
      var isActive = ACTIVE_STATUSES.indexOf(c1status) !== -1;
      var startDisabled = isActive ? ' disabled' : '';
      var stopDisabled  = isActive ? '' : ' disabled';

      card.innerHTML =
        '<div class="s-card-top">' +
          '<span class="s-cp-id">' + esc(cpId) + '</span>' +
          '<span class="s-status-pill pill-online">ONLINE</span>' +
        '</div>' +
        '<div class="s-meta">' + esc(meta) + fw + '</div>' +
        '<div class="connectors">' + connectorBadgesHtml(ev.connectors) + '</div>' +
        heartbeatHtml(ev.last_heartbeat) +
        '<div class="s-actions">' +
          '<button class="btn-start"' + startDisabled + ' onclick="sendAction(\'' + esc(cpId) + '\', \'RemoteStartTransaction\')">▶ Başlat</button>' +
          '<button class="btn-stop"' + stopDisabled + '  onclick="sendAction(\'' + esc(cpId) + '\', \'RemoteStopTransaction\')">■ Durdur</button>' +
        '</div>';
    }

    function markOffline(cpId) {
      var card = document.getElementById('card-' + cpId);
      if (!card) return;
      card.className = 's-card';
      var pill = card.querySelector('.s-status-pill');
      if (pill) { pill.className = 's-status-pill pill-offline'; pill.textContent = 'OFFLINE'; }
      onlineCount = Math.max(0, onlineCount - 1);
      updateStationCount();
    }

    // ── SSE connection ────────────────────────────────────────────
    var pill = document.getElementById('conn-pill');

    function connectSSE() {
      var es = new EventSource('/events');

      es.onopen = function() {
        pill.textContent = '● Bağlı';
        pill.className = 'connected';
      };

      es.onmessage = function(e) {
        var ev;
        try { ev = JSON.parse(e.data); } catch(x) { return; }

        if (ev.type === 'log')               { addLogRow(ev); }
        else if (ev.type === 'charger_update')    { upsertCard(ev); }
        else if (ev.type === 'charger_disconnect'){ markOffline(ev.cp_id); }
      };

      es.onerror = function() {
        pill.textContent = '● Bağlantı kesildi (yeniden bağlanıyor…)';
        pill.className = 'error';
      };
    }

    connectSSE();
  </script>
</body>
</html>
